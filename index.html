<!doctype html>
<html lang="en-GB">

	<head>

		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">

		<title>Lil' Chess Timer</title>
		<meta name="description" content="A simple little chess timer made for mobile.">
		<link rel="icon" type="image/png" href="favicon-512x512.png">

		<link rel="manifest" href="manifest.json">

		<link rel="stylesheet" href="style.css">

		<script src="fsm.js"></script>
		<script src="lobby.js"></script>
		<script src="timer.js"></script>
		<script src="main.js"></script>

	</head>

	<body>

		<div class="main">

			<div class="screen screen_lobby" hidden>

				<div class="lobby">

					<h1>Lil' Chess Timer</h1>

					<form class="lobby_settings">
						<p>
							<label>
								<span>Minutes per player</span>
								<input type="number" class="lobby_minutes_per_player_input" value="10" step="5" min="5" max="4320">
							</label>
						</p>
						<p>
							<label>
								<span>Extra seconds per move</span>
								<input type="number" class="lobby_extra_seconds_per_move_input" value="0" step="5" min="0" max="600">
							</label>
						</p>
						<p>
							<button class="lobby_go_button">▶️ Start</button>
							<button class="lobby_reset_button" type="reset">♻️ Reset</button>
						</p>
					</form>

				</div>

			</div>

			<div class="screen screen_timer" hidden>

				<div class="timer">

					<div class="timer_controls">
						<div class="timer_control">
							<button class="timer_control_button timer_playpause_button"><span class="when_paused">▶️ Play</span><span class="when_not_paused">⏸️ Pause</span></button>
						</div>
						<div class="timer_control">
							<button class="timer_control_button timer_reset_button">♻️ Reset</button>
						</div>
						<div class="timer_control">
							<button class="timer_control_button timer_back_button">❌ Back</button>
						</div>
					</div>

					<div class="timer_player timer_player_1">
						<button class="timer_player_button timer_player_1_button" data-player-index="0">Player 1</button>
					</div>

					<div class="timer_player timer_player_2">
						<button class="timer_player_button timer_player_2_button" data-player-index="1">Player 2</button>
					</div>

				</div>

			</div>

		</div>

		<script>

			// --------------------------------------------------

			const main = new MAIN( document.querySelector( '.main' ) );

			// --------------------------------------------------

		</script>

	</body>

</html>
